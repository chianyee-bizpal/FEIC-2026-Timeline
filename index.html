<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEIC 2026 Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#DCE2E8; --panel:#FFFFFF; --panel2:#F3F6F8; --ink:#16243B; --ink2:#2B3B52;
  --muted:#5D6D80; --rule:#C6D0DA; --rule2:#E2E9EF; --line:#7E8C9B;
  --teal:#0E6E6A; --amber:#B9820C; --alert:#A9382A; --violet:#6E46AD; --green:#2E7D52;
  --box:#A8DCE0; --boxink:#10303A;
  --shadow:0 1px 0 rgba(22,36,59,.05), 0 6px 18px -13px rgba(22,36,59,.4);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E151D; --panel:#18222E; --panel2:#1E2937; --ink:#E2E9F0; --ink2:#C4D0DC;
  --muted:#93A3B5; --rule:#2C3A4A; --rule2:#233040; --line:#55677A;
  --teal:#4BB3AC; --amber:#E0A93F; --alert:#E0705E; --violet:#A98BE0; --green:#59B37F;
  --box:#1D4A52; --boxink:#CFECEF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -15px rgba(0,0,0,.85);}}
:root[data-theme="dark"]{
  --ground:#0E151D; --panel:#18222E; --panel2:#1E2937; --ink:#E2E9F0; --ink2:#C4D0DC;
  --muted:#93A3B5; --rule:#2C3A4A; --rule2:#233040; --line:#55677A;
  --teal:#4BB3AC; --amber:#E0A93F; --alert:#E0705E; --violet:#A98BE0; --green:#59B37F;
  --box:#1D4A52; --boxink:#CFECEF;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -15px rgba(0,0,0,.85);}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,nav,button,select,input,.num,.mono{font-family:Archivo,"Source Sans 3",sans-serif}
h1{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:0}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

header.top{background:var(--panel);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:50}
.topin{max-width:1560px;margin:0 auto;padding:14px 22px 0;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
.mk{font-family:Archivo;font-weight:700;font-size:19px;letter-spacing:-.02em}
.mk span{font-weight:500;font-size:13px;color:var(--muted);margin-left:10px;letter-spacing:0}
.tabs{max-width:1560px;margin:0 auto;padding:10px 22px 0;display:flex;gap:4px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 18px;border-radius:7px 7px 0 0;
  font-family:Archivo;font-size:14px;font-weight:600;color:var(--muted);border:1px solid transparent;border-bottom:none}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--ground);color:var(--ink);border-color:var(--rule)}
.right{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
main{max-width:1560px;margin:0 auto;padding:22px 22px 70px}
.view{display:none}.view.on{display:block}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:22px 24px 16px;box-shadow:var(--shadow);margin-bottom:16px}
.heroTop{display:flex;flex-wrap:wrap;gap:16px 30px;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.count{font-family:Archivo;font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1}
.count small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:9px}
.nextgate{text-align:right;font-size:13px;color:var(--muted);max-width:330px}
.nextgate b{display:block;font-family:Archivo;font-size:15px;color:var(--ink);font-weight:600}
.spine{position:relative;height:70px}
.spineTrack{position:absolute;left:0;right:0;top:28px;height:14px;background:var(--panel2);border:1px solid var(--rule2);border-radius:3px;overflow:hidden;display:flex}
.seg{height:100%;border-right:1px solid var(--panel)}
.seg:last-child{border-right:0}
.spineLbl{position:absolute;top:0;font-size:10.5px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.mdot{position:absolute;top:18px;width:7px;height:7px;transform:translateX(-50%) rotate(45deg);background:var(--ink);border-radius:1px}
.mdot.risky{background:var(--alert)}
.today{position:absolute;top:12px;height:46px;width:2px;background:var(--alert)}
.today::after{content:"today";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:Archivo;font-size:10px;font-weight:700;color:var(--alert)}
.spineDates{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.stack{display:flex;height:24px;border-radius:5px;overflow:hidden;border:1px solid var(--rule2);margin:4px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;flex:0 0 10px}
.list{list-style:none;margin:0;padding:0;font-size:13.5px}
.list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule2);align-items:baseline}
.list li:last-child{border-bottom:0}
.list .who{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.list .dt{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.od{color:var(--alert);font-weight:600}
.wsbar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.wsbar .nm{width:210px;flex:0 0 210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbar .tr{flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--rule2)}
.wsbar .fl{height:100%}
.wsbar .pc{width:62px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.mutedline{font-size:12.5px;color:var(--muted)}
.btn{all:unset;cursor:pointer;font-family:Archivo;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:6px;border:1px solid var(--rule);color:var(--ink2);background:var(--panel2)}
.btn:hover{border-color:var(--teal);color:var(--teal)}
.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
select{font-family:Archivo;font-size:12.5px;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--panel2);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.spacer{flex:1}
.pagehd{margin-bottom:12px}
.pagehd p{margin:5px 0 0;font-size:13.5px;color:var(--muted);max-width:78ch}

/* gantt */
.gantt{background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.gwrap{overflow-x:auto}
.ginner{min-width:1240px;position:relative}
.gdates{width:120px;flex:0 0 120px;display:flex;border-right:1px solid var(--rule);font-family:Archivo;
  font-size:11px;color:var(--muted);align-items:center;font-variant-numeric:tabular-nums}
.gdates span{flex:1;text-align:center;padding:5px 2px;white-space:nowrap}
.gdates span:first-child{border-right:1px dotted var(--rule2)}
.ghead .gdates{font-weight:600}
.gwsrow .gdates{font-weight:600;color:var(--ink2)}
.gdates .od{color:var(--alert);font-weight:700}
.mode{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3px;
  font-family:Archivo;font-size:9.5px;font-weight:700;flex:0 0 15px;color:#fff;vertical-align:middle}
.mode.online{background:#2C5FA8}.mode.physical{background:#B45309}.mode.hybrid{background:#6E46AD}
.mode.tbc{background:#6B7F94}
.mode.blank{background:transparent}
.modetag{display:inline-block;padding:2px 7px;border-radius:4px;font-family:Archivo;font-size:10.5px;
  font-weight:700;color:#fff}
.grow{display:flex;border-bottom:1px solid var(--rule2)}
.glabel{width:300px;flex:0 0 300px;padding:5px 12px;font-size:12.5px;border-right:1px solid var(--rule);display:flex;gap:8px;align-items:center;min-width:0}
.glabel .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtrack{flex:1;position:relative;height:26px;min-width:0}
.gbar{position:absolute;top:7px;height:13px;border-radius:3px;min-width:4px}
.gbar span{position:absolute;left:100%;margin-left:7px;top:-2px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.gwsrow{background:var(--panel2);font-family:Archivo;font-weight:600;font-size:12.5px;cursor:pointer}
.gwsrow:hover{background:var(--rule2)}
.gtaskrow{cursor:pointer}
.gtaskrow:hover{background:var(--panel2)}
.ghead{display:flex;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:3}
.ghead .glabel{font-family:Archivo;font-weight:600;font-size:11.5px;color:var(--muted)}
.gmonths{flex:1;display:flex;position:relative}
.gmonth{font-family:Archivo;font-size:11.5px;font-weight:600;color:var(--muted);border-left:1px solid var(--rule2);padding:6px 0 6px 7px}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--alert);z-index:2;pointer-events:none}
.gmile{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);z-index:1;pointer-events:none}
.caret{display:inline-block;width:10px;color:var(--muted)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 272px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.colhd{padding:10px 13px;border-bottom:1px solid var(--rule2);display:flex;justify-content:space-between;align-items:center;font-family:Archivo;font-weight:600;font-size:13.5px;border-top:3px solid var(--rule);border-radius:9px 9px 0 0}
.colhd .ct{font-size:12.5px;color:var(--muted)}
.colbody{padding:9px;display:flex;flex-direction:column;gap:8px;max-height:70vh;overflow-y:auto}
.kcard{border:1px solid var(--rule2);border-left:3px solid var(--rule);border-radius:7px;padding:9px 10px;background:var(--panel2);cursor:pointer}
.kcard:hover{border-color:var(--teal)}
.kcard .kt{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:6px}
.kmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);align-items:center}
.tag{font-family:Archivo;font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--rule);color:var(--muted)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:12.5px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(12,20,30,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}
.modal{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.mhd{padding:18px 22px 12px;border-bottom:1px solid var(--rule2)}
.mhd .mid{font-family:Archivo;font-size:11.5px;font-weight:600;color:var(--muted)}
.mhd h2{margin:4px 0 0;font-size:19px}
.mbd{padding:16px 22px 22px}
.mbd h3{font-family:Archivo;font-size:11px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.mbd h3:first-child{margin-top:0}
.mbd p{margin:0;font-size:14px}
.statbtns{display:flex;flex-wrap:wrap;gap:7px}
.statbtns button{all:unset;cursor:pointer;font-family:Archivo;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:7px;border:1.5px solid var(--rule);color:var(--ink2)}
.statbtns button[aria-pressed="true"]{color:#fff}
.mfoot{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--rule2);align-items:center;flex-wrap:wrap}
input[type=date],input[type=text],textarea,.mbd select{font-family:"Source Sans 3";font-size:13.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--panel2);color:var(--ink);width:100%}
textarea{resize:vertical;line-height:1.4}
.fld{margin-bottom:12px}
.fld label{display:block;font-family:Archivo;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.btn.danger{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 45%,var(--rule))}
.btn.danger:hover{background:var(--alert);color:#fff;border-color:var(--alert)}
.btn.danger.on{background:var(--alert);color:#fff;border-color:var(--alert)}
.gone{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule2);font-size:13.5px}
.gone:last-child{border-bottom:0}
.gone .who{margin-left:auto;color:var(--muted);font-size:12.5px}

/* WBS */
.wbswrap{background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:26px 22px 30px;overflow-x:auto}
.wbsroot{display:flex;flex-direction:column;align-items:center;min-width:1520px}
.nodebox{border:1px solid var(--line);background:var(--box);color:var(--boxink);border-radius:2px;
  padding:6px 9px;font-size:12px;line-height:1.3;text-align:center;box-shadow:1px 1px 0 rgba(0,0,0,.08)}
.nodebox .no{font-family:Archivo;font-weight:700;font-size:11px;display:block}
.nodebox .lb{display:block;margin-top:1px}
.rootbox{min-width:230px;font-size:13px}
.branches{display:flex;align-items:flex-start;width:100%}
.branch{flex:1 1 0;min-width:250px;padding:0 6px;position:relative;padding-top:22px}
.branch::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1px solid var(--line)}
.branch::after{content:"";position:absolute;top:0;left:0;right:0;border-top:1px solid var(--line)}
.branch:first-child::after{left:50%}
.branch:last-child::after{right:50%}
.branch>.nodebox{margin:0 auto}
.rootstub{width:1px;height:22px;background:var(--line)}
.kids{margin-top:10px;padding-left:16px}
.node{position:relative;padding-left:18px;padding-bottom:8px}
.node::before{content:"";position:absolute;left:0;top:0;height:100%;border-left:1px solid var(--line)}
.node:last-child::before{height:15px}
.node::after{content:"";position:absolute;left:0;top:15px;width:18px;border-top:1px solid var(--line)}
.node>.nodebox{text-align:left;cursor:default}
.node>.nodebox.click{cursor:pointer}
.node>.nodebox.click:hover{filter:brightness(.95)}
.node .kids{margin-top:8px;padding-left:14px}
.wsbox{color:#fff;border-color:rgba(0,0,0,.25)}
.taskbox{background:var(--panel);color:var(--ink);font-size:11.5px}
.taskbox .mt{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);font-family:Archivo;font-weight:500}
.taskbox .mt b{font-weight:600;color:var(--ink2)}
.taskbox .mt .late{color:var(--alert);font-weight:700}
.taskbox .mt .moved{color:var(--violet);font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.wbskey{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:9px 14px;
  box-shadow:var(--shadow);margin-bottom:14px;font-size:11.5px;color:var(--muted)}
.keyrow{display:flex;flex-wrap:wrap;gap:5px 13px;align-items:center;padding:5px 0}
.keyrow+.keyrow{border-top:1px solid var(--rule2)}
.keyrow b{font-family:Archivo;font-size:11px;font-weight:600;color:var(--ink2);min-width:140px}
.keyrow span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 17px;border-radius:7px;font-size:13px;font-family:Archivo;font-weight:600;z-index:120}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px}
.syncdot.live{background:var(--green)}
@media (max-width:820px){
  main{padding:16px 13px 60px}.topin,.tabs{padding-left:13px;padding-right:13px}
  .g2,.g3{grid-template-columns:1fr}.count{font-size:32px}.nextgate{text-align:left}
  .wsbar .nm{width:130px;flex:0 0 130px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="mk">FEIC 2026 <span>Financial Empowerment Innovation Challenge</span></div>
    <div class="right"><span id="syncstate"><span class="syncdot"></span>This browser only</span>
      <button class="btn" id="themebtn">Theme</button></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main>
  <section class="view on" id="v-dash"></section>
  <section class="view" id="v-time"></section>
  <section class="view" id="v-board"></section>
  <section class="view" id="v-wbs"></section>
</main>

epending on D20."},{"id":"M18","name":"Live Pitching Day","date":"2026-12-13","owner":"TBC","status":"Blocked","task":"T-223","source":"Both","note":"10 teams, 7-minute pitch + 5-minute Q&A. Format unresolved (D20) and still no named owner (D01)."},{"id":"M19","name":"Awards Ceremony","date":"2026-12-19","owner":"Mayang","status":"Not Started","task":"T-244","source":"Project Brief","note":"Format unresolved \u2014 decision D20."},{"id":"M20","name":"Close-Out Complete","date":"2026-12-31","owner":"Mayang","status":"Not Started","task":"T-249","source":"Stakeholder Task List","note":"Feedback, sponsor follow-up, archive and review all inside December."}],"risks":[{"id":"R23","title":"The plan has almost no slack","detail":"Finishing before Christmas means a 19-day pre-launch instead of the six weeks the January plan allowed. Phase 2 lost 2 days and Phase 3 lost 2 days against the brief. A one-week slip anywhere before 5 October pushes the final past Christmas.","likelihood":"High","impact":"High","owner":"Wayne","mitigation":"Three dates carry the whole plan: website live 30 Sep, outreach out 1 Oct, registration open 5 Oct. Check those three every day, not weekly. If any slips more than three days, take decision D17."},{"id":"R01","title":"Launch readiness gate missed on 30 September","detail":"Everything public-facing has to be finished and tested before the first invitation goes out: website, registration form, participant database, competition pages, rules, prize values, sponsorship page and a staffed contact channel. Promotion cannot start without it, and registration opens 10 Oct.","likelihood":"High","impact":"High","owner":"Yang Ler","mitigation":"Run the checklist on 29 Sep, a day early, so there is a day to fix whatever fails. If the gate cannot pass, ship a landing page carrying the form, key dates, rules and the problem statement spec \u2014 that is enough to invite people to \u2014 and add the rest during Phase 1. Do not send invitations to a half-built site."},{"id":"R27","title":"Phase 4 format still undecided","detail":"Whether the pitch, the awards, or both are physical is unresolved. 26 tasks are affected, and venue booking, AV hire, seating, catering and event-day manpower all have lead times that run out during Phase 1.","likelihood":"High","impact":"High","owner":"Wayne","mitigation":"Answer by 9 Oct (decision D20). Until then, keep the online path fully resourced \u2014 Zoom or Teams is needed for the Phase 2 briefings regardless \u2014 and run the venue shortlist in parallel so a physical decision does not start from zero."},{"id":"R28","title":"Twenty-day build period","detail":"Phase 3 runs 9-28 November. The brief allowed 28 days; this gives 20. The metric at risk is submission completion, targeted at 70% of accepted teams.","likelihood":"Medium","impact":"High","owner":"Chin Yoke","mitigation":"Release the problem statement brief and platform credentials on 26 Oct, the first day of Phase 2, so teams can start thinking two weeks before the build window opens. Mid-point reminder on 18 Nov and mentor office hours throughout."},{"id":"R24","title":"Institutions get 19 days between invitation and close","detail":"The full invitation goes out 1 Oct and submissions close 20 Oct. University offices routinely take two weeks just to reply.","likelihood":"Medium","impact":"High","owner":"Chian Yee","mitigation":"Save-the-date on 25 Sep (B-060) gives them an extra week. Lead with student clubs and ambassadors, who move in days. Use co-organiser EDMs to reach students directly rather than waiting on offices."},{"id":"R02","title":"No owner for the live pitching final","detail":"Still '?' in the stakeholder list. Nine tasks are blocked and a physical final makes the role bigger.","likelihood":"High","impact":"High","owner":"Wayne","mitigation":"Name the lead by 22 September. On this schedule there is no month of slack to absorb it."},{"id":"R06","title":"Fewer than 50 teams register","detail":"The brief's headline metric, against an 11-day registration window \u2014 four days shorter than the brief assumed.","likelihood":"High","impact":"High","owner":"Wayne","mitigation":"Count registrations daily from 13 Oct, not weekly. If the 15 Oct number is under 25 teams, extend submissions to 22 Oct and take the two days from the review window, not from the build period."},{"id":"R25","title":"Sixty problem statements in three days","detail":"Registration closes 25 Oct and accepted teams must be confirmed by 28 Oct, per the brief.","likelihood":"Medium","impact":"High","owner":"Chin Yoke","mitigation":"Assign a second reviewer now (decision D18), and score against a simple published rubric so reviews are quick and defensible."},{"id":"R16","title":"Co-organiser MOUs will not be signed in time","detail":"Legal review runs 4-8 weeks against a 13 Nov target, and approaches only start on 1 Oct.","likelihood":"High","impact":"Medium","owner":"Anya","mitigation":"Let partners act as Supporting Partners without an MOU so their student EDMs can go out during registration, and convert to co-organiser later (decision D19)."},{"id":"R17","title":"BizPal modules and templates not ready","detail":"Modules by 9 Oct and templates by 20 Oct, both against a brief that expected them finished in September.","likelihood":"Medium","impact":"High","owner":"Chin Yoke","mitigation":"The briefings are not until 4 and 7 November, so the real deadline is 26 Oct for credentials. Build the templates and the export path first; polish tutorials after teams are in."},{"id":"R18","title":"Prize values still TBD","detail":"Brief \u00a77 leaves Champion and both runner-ups blank. The launch post goes out 2 Oct.","likelihood":"Medium","impact":"High","owner":"Wayne","mitigation":"Fix the figures by 28 Sep. If sponsorship is not closed, publish a minimum pool BizPal will fund alone."},{"id":"R08","title":"Venue not secured for 19 December","detail":"The brief was fully online, so no venue was ever budgeted, and mid-December is a busy season for function space.","likelihood":"Medium","impact":"High","owner":"Anya","mitigation":"Shortlist by 9 Oct, book by 13 Nov. Ask co-organiser institutions first \u2014 brief \u00a79 already lists venue support as something partners bring, and a campus hall in exam-break week is easy to get."},{"id":"R09","title":"Judges unavailable on 19 December","detail":"Five judges free on the Saturday before Christmas is a harder ask than any other date in the year.","likelihood":"High","impact":"High","owner":"Anya","mitigation":"Invite twelve to land five. Confirm in writing by 13 Nov, name two reserves, and tell candidates the date in the very first email rather than at confirmation."},{"id":"R26","title":"The final falls in exam and holiday season","detail":"Many Malaysian universities are in or near final exams in mid-December, and 19 Dec is six days before Christmas. Finalist availability and audience turnout are both at risk.","likelihood":"Medium","impact":"Medium","owner":"Wayne","mitigation":"Confirm finalist availability the moment the shortlist is announced on 11 Dec, and offer travel support if the venue is not central. Livestream so the audience number does not depend on attendance."},{"id":"R10","title":"Technical failure at the physical final","detail":"Projector, audio, laptops, a finalist deck, or the livestream failing in front of judges.","likelihood":"Medium","impact":"High","owner":"Chin Yoke","mitigation":"On-site rehearsal 17-18 Dec, two backup copies of every deck, backup laptop, backup internet, and a one-page contingency plan on the crew's phones."},{"id":"R20","title":"Livestream fails","detail":"The final is physical but brief \u00a712 still targets 200+ live viewers.","likelihood":"Medium","impact":"Medium","owner":"Chin Yoke","mitigation":"Give the stream its own operator and its own connection, separate from the venue AV. Record as fallback."},{"id":"R07","title":"Sponsorship not confirmed by 13 November","detail":"Prize pool, venue and catering all depend on it, and outreach only starts 1 Oct.","likelihood":"Medium","impact":"High","owner":"Anya","mitigation":"Agree the minimum pool BizPal funds alone, so nothing public waits on a sponsor's reply."},{"id":"R11","title":"Judging rubric not agreed before scoring opens","detail":"The brief defines six weighted criteria but the panel has not seen them.","likelihood":"Low","impact":"High","owner":"Wayne","mitigation":"Rubric to judges by 27 Nov, ten days before scoring opens on 7 Dec."},{"id":"R04","title":"No support or backup person on any workstream","detail":"The stakeholder Excel left the support column empty for all rows, and two workstreams have been added since. On a plan this tight, one person being ill stops a workstream.","likelihood":"High","impact":"High","owner":"Wayne","mitigation":"Name a second person per workstream by 21 Sep, starting with website, BizPal platform and outreach."},{"id":"R03","title":"Conflicting PIC for Competition Infrastructure","detail":"The workflow PNG says PIC: CYL; the stakeholder list says Wayne.","likelihood":"Medium","impact":"Medium","owner":"Wayne","mitigation":"Resolve by 18 Sep and correct whichever source is wrong."},{"id":"R13","title":"Participant data handling","detail":"The database holds student names, emails and phone numbers, and brief \u00a79 promises partners an anonymised insights report.","likelihood":"Low","impact":"High","owner":"Yang Ler","mitigation":"Consent wording on the form, access limited to Yang Ler and Wayne, anonymise before anything reaches a co-organiser."},{"id":"R14","title":"Outreach emails bounce or land in spam","detail":"Bulk sending to unverified addresses can get the domain filtered right when it matters most.","likelihood":"Medium","impact":"High","owner":"Chian Yee","mitigation":"Verify before sending, send in batches of 30 or fewer, personalise the opening line."}],"decisions":[{"id":"D20","question":"Is the pitch physical, the awards physical, or both on one day?","owner":"Wayne","due":"2026-10-09","status":"Open","note":"The brief has the pitch online on 13 Dec and the awards online on 19 Dec. The team expects at least part of the final to be physical, but which part is not settled. Three options: (a) pitch online 13 Dec, awards physical 19 Dec; (b) pitch physical 13 Dec, awards online 19 Dec; (c) pitch and awards physical together on one day. Venue lead time forces an answer by 9 Oct. 26 tasks are marked TBC until this is decided.","task":"T-140"},{"id":"D17","question":"If the website is not live on 30 September, what happens?","owner":"Wayne","due":"2026-09-22","status":"Open","note":"Website go-live on 30 Sep carries Phase 0. Agree the fallback now, not on the day: either launch a single landing page with the registration form, key dates and the problem statement spec, or accept that outreach and the launch post slip past 1 Oct.","task":"T-010"},{"id":"D01","question":"Who leads the live pitching final?","owner":"Wayne","due":"2026-09-22","status":"Open","note":"Still '?' in the stakeholder list. Nine tasks blocked, and there is no slack left to absorb it. The brief calls the role Awards & Events Lead.","task":"T-006"},{"id":"D04","question":"Fix the prize values","owner":"Wayne","due":"2026-09-28","status":"Open","note":"Champion and both runner-up prizes are TBD in brief \u00a77. The launch post goes out on 2 Oct.","task":"B-022"},{"id":"D18","question":"Who is the second reviewer for problem statements?","owner":"Wayne","due":"2026-10-09","status":"Open","note":"Up to 60 problem statements must be read and decided between 21 and 25 October. Five days is workable, but not for one person alongside their other work.","task":"B-040"},{"id":"D05","question":"Who is the support person on each workstream?","owner":"Wayne","due":"2026-09-21","status":"Open","note":"The Excel support column is empty for all rows. On a compressed plan one absence stops a workstream.","task":"T-007"},{"id":"D02","question":"Is Competition Infrastructure owned by Wayne or CYL?","owner":"Wayne","due":"2026-09-18","status":"Open","note":"The workflow PNG and the stakeholder list disagree.","task":"T-005"},{"id":"D13","question":"Map the brief's seven roles onto the nine named people","owner":"Wayne","due":"2026-09-25","status":"Open","note":"Competition Director, Operations Lead, Marketing & Comms Lead, BizPal Platform Lead, Partnership & Outreach Lead, Judging Coordinator, Awards & Events Lead.","task":"T-004"},{"id":"D14","question":"Who owns the two new workstreams?","owner":"Wayne","due":"2026-09-25","status":"Open","note":"Co-Organisers & Partners proposed to Anya, BizPal Platform & Learning to Chin Yoke. Neither is named in any source file.","task":"B-001"},{"id":"D16","question":"Confirm the 60-team cap and what happens past it","owner":"Wayne","due":"2026-09-30","status":"Open","note":"Brief \u00a74 caps a cohort at 60 but does not say how over-subscription is handled.","task":"B-024"},{"id":"D15","question":"Discord or WhatsApp for the participant channel?","owner":"Yang Ler","due":"2026-10-09","status":"Open","note":"The workflow PNG says WhatsApp, the brief says Discord or equivalent. Both are planned \u2014 WhatsApp for public enquiries, Discord for accepted teams.","task":"B-015"},{"id":"D19","question":"Do co-organiser MOUs have to be signed before outreach?","owner":"Wayne","due":"2026-09-30","status":"Open","note":"University legal review runs 4-8 weeks and will not finish before registration opens. Letting partners act as Supporting Partners first keeps outreach moving.","task":"B-004"}],"outreach":[{"id":"IO-001","institution":"Universiti Malaya (UM)","itype":"Public University (IPTA)","state":"Kuala Lumpur","faculty":"","club":"","person":"","role":"","email":"","phone":"","source_url":"","warm":"Cold","connection":"","assigned":"Chian Yee","contacted":"","fu1":"","fu2":"","response":"No Response Yet","interest":"","outcome":"","status":"Not Contacted","notes":"Target faculty: bus <script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('seed').textContent);
var TODAY=D.baseline, T0=D.t0, T1=D.t1;
function d(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function days(a,b){return Math.round((d(b)-d(a))/864e5);}
var SPAN=days(T0,T1);
function pct(s){return Math.max(0,Math.min(100,days(T0,s)/SPAN*100));}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(s){if(!s)return '—';var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1];}
function fmtL(s){if(!s)return '—';var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function el(i){return document.getElementById(i);}
function addDays(s,n){var t=new Date(d(s)+n*864e5);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0');}

var WS={};D.workstreams.forEach(function(w){WS[w.id]=w;});
var STATUSES=['Not Started','In Progress','Waiting','Blocked','Needs New Date','Done'];
function MODEC(m){return m==='Physical'?'#B45309':m==='Online'?'#2C5FA8':m==='TBC'?'#6B7F94':'#6E46AD';}
var MODEOPTS=[{v:'',l:'Not applicable \u2014 internal work'},{v:'Online',l:'Online'},
  {v:'Physical',l:'Physical'},{v:'Hybrid',l:'Hybrid'},{v:'TBC',l:'TBC \u2014 waiting on the format decision'}];
var SC={'Not Started':'#8FA3B8','In Progress':'#C89210','Waiting':'#D97828','Blocked':'#BE3A2A','Needs New Date':'#8B5CC7','Done':'#2E8B57'};
var HELP={'Not Started':'Not begun yet.','In Progress':'Someone is working on it now.',
 'Waiting':'Waiting on a decision or on someone else.','Blocked':'Cannot start at all.',
 'Needs New Date':'The old deadline has passed — set a new one.','Done':'Finished.'};
function normStatus(s){ if(s==='Needs Rebaseline') return 'Needs New Date'; if(s==='To Do') return 'Not Started';
  return STATUSES.indexOf(s)<0 ? 'Not Started' : s; }

/* ─────────────────────────────────────────────────────────────────────────
   SHARED SYNC — paste your Google Apps Script /exec URL between the quotes
   below and everyone who opens this page shares one live plan, with no
   account needed. Leave it empty and changes stay in this browser only.
   Setup takes about ten minutes — see SETUP.md.
   ───────────────────────────────────────────────────────────────────────── */
var SYNC_URL = "https://script.google.com/macros/s/AKfycbzZNfxGZ1GRmD_GkkNJm6khXRvCerdcsxZEr5sJHXM1RIdIcA6V0esV--L2eR118baRUQ/exec";

var overlay={},custom={},db=null;
var remoteOn=/^https:\/\/\S+$/.test(SYNC_URL), pulling=false, lastPull=0, pushQ={}, pushT=null;
try{var r=localStorage.getItem('feic26.overlay');if(r)overlay=JSON.parse(r)||{};}catch(e){}
try{var r2=localStorage.getItem('feic26.custom');if(r2)custom=JSON.parse(r2)||{};}catch(e){}
function saveLocal(){
  try{localStorage.setItem('feic26.overlay',JSON.stringify(overlay));}catch(e){}
  try{localStorage.setItem('feic26.custom',JSON.stringify(custom));}catch(e){}}
function base(){
  var arr=D.tasks.slice();
  Object.keys(custom).forEach(function(k){arr.push(custom[k]);});
  return arr;}
function T(t){var o=overlay[t.id]||{};
  function p(k){return o[k]!==undefined&&o[k]!==null?o[k]:t[k];}
  var st=p('start'),du=p('due'),rv=p('revised'),en=rv||du;
  return{id:t.id,phase:p('phase'),ws:p('ws'),main:t.main,sub:p('sub'),desc:p('desc'),
    dod:t.dod,owner:p('owner'),start:st,due:du,revised:rv,actual:p('actual'),
    priority:p('priority'),status:normStatus(p('status')),deps:t.deps||[],milestone:t.milestone,
    risk:t.risk,notes:p('notes'),source:t.source,custom:!!t.isCustom,
    mode:(o.mode!==undefined?o.mode:(t.mode||'')),brief:t.brief||'',
    deleted:(o.deleted!==undefined?!!o.deleted:!!t.deleted),
    duration:Math.max(1,days(st,en)+1)};}
function all(){return base().map(T).filter(function(t){return !t.deleted;});}
function removed(){return base().map(T).filter(function(t){return t.deleted;});}
function byId(id){var b=base().filter(function(x){return x.id===id;})[0];return b?T(b):null;}
function endOf(t){return t.revised||t.due;}
function isOverdue(t){return t.status!=='Done'&&endOf(t)<TODAY;}
function dueWithin(t,n){var e=endOf(t);return t.status!=='Done'&&e>=TODAY&&days(TODAY,e)<=n;}
function setTask(id,patch){
  overlay[id]=Object.assign({},overlay[id],patch);saveLocal();
  if(db){try{db.doc('taskState/'+id).set(Object.assign({id:id},overlay[id])).catch(function(){});}catch(e){}}
  push(id);
  render();
}
/* ── shared sync over a Google Sheet ── */
function syncState(txt,live){
  var n=el('syncstate'); if(!n) return;
  n.innerHTML='<span class="syncdot'+(live?' live':'')+'"></span>'+txt;
}
function push(id){
  if(!remoteOn) return;
  pushQ[id]=true;
  clearTimeout(pushT);
  pushT=setTimeout(flush,400);
}
function flush(){
  var ids=Object.keys(pushQ); pushQ={};
  if(!ids.length) return;
  ids.forEach(function(id){
    var body={id:id,patch:overlay[id]||{},task:custom[id]||null};
    fetch(SYNC_URL,{method:'POST',body:JSON.stringify(body),
      headers:{'Content-Type':'text/plain;charset=utf-8'}})
      .then(function(){syncState('Shared \u00b7 saved',true);})
      .catch(function(){syncState('Shared \u00b7 save failed',false);
        toast('Could not save to the shared plan \u2014 check your connection.');});
  });
}
function pull(){
  if(!remoteOn||pulling) return;
  pulling=true;
  fetch(SYNC_URL+'?t='+Date.now(),{method:'GET'})
    .then(function(r){return r.json();})
    .then(function(rows){
      pulling=false; lastPull=Date.now();
      if(!Array.isArray(rows)) return;
      var changed=false;
      rows.forEach(function(r){
        if(!r||!r.id) return;
        var cur=JSON.stringify(overlay[r.id]||{});
        if(r.patch&&JSON.stringify(r.patch)!==cur){overlay[r.id]=r.patch;changed=true;}
        if(r.task&&JSON.stringify(custom[r.id]||{})!==JSON.stringify(r.task)){custom[r.id]=r.task;changed=true;}
      });
      syncState('Shared with your team',true);
      if(changed){saveLocal();render();}
    })
    .catch(function(){pulling=false;syncState('Shared \u00b7 offline',false);});
}
if(remoteOn){
  syncState('Shared \u00b7 connecting\u2026',false);
  pull();
  setInterval(pull,12000);
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&Date.now()-lastPull>4000) pull();});
}
function newId(){var n=1;while(custom['C-'+String(n).padStart(3,'0')])n++;return 'C-'+String(n).padStart(3,'0');}
function addTask(f){
  var id=newId();
  custom[id]={id:id,isCustom:true,phase:f.phase,ws:f.ws,main:WS[f.ws].name,sub:f.sub,desc:f.desc||'',
    dod:f.dod||'',owner:f.owner,start:f.start,due:f.due,revised:'',actual:'',priority:f.priority,
    status:f.status,deps:[],milestone:'',risk:'',notes:f.notes||'',mode:f.mode||'',brief:'',
    source:'Added by the team'};
  saveLocal();
  if(db){try{db.doc('customTasks/'+id).set(custom[id]).catch(function(){});}catch(e){}}
  push(id);
  render();toast('Added '+id);
}

function plainSave(fn,txt){

    a.href=u;a.download=fn;document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(u);},0);

  var deps=t.deps.map(function(x){var y=byId(x);return y?y.sub:x;});
  var h='<div class="mhd"><div class="mid">'+t.id+' · <span style="color:'+w.color+'">'+esc(w.name)+'</span>'+
    (t.custom?' · <span class="tag">added by the team</span>':'')+'</div><h2>'+esc(t.sub)+'</h2></div><div class="mbd">'+
    (t.desc?'<h3>What it involves</h3><p>'+esc(t.desc)+'</p>':'')+
    (t.dod?'<h3>Finished when</h3><p>'+esc(t.dod)+'</p>':'')+
    '<h3>Owner</h3><p>'+esc(t.owner)+(t.owner==='TBC'?' — nobody named yet':'')+'</p>'+
    '<h3>Dates</h3><p>'+fmtL(t.start)+' to '+fmtL(t.due)+(t.revised&&t.revised!==t.due?' &nbsp;\u00b7&nbsp; new date: <b>'+fmtL(t.revised)+'</b>':'')+'</p>'+
    (t.mode?'<h3>How it runs</h3><p><span class="modetag" style="background:'+MODEC(t.mode)+'">'+t.mode+'</span></p>':'')+
    (t.brief?'<h3>From Wayne\u2019s brief</h3><p class="mutedline">'+esc(t.brief)+'</p>':'')+
    (deps.length?'<h3>Cannot finish before</h3><p>'+esc(deps.join(' · '))+'</p>':'')+
    (t.notes?'<h3>Notes</h3><p>'+esc(t.notes)+'</p>':'')+
    '<h3>Status — tap to change</h3><div class="statbtns">'+STATUSES.map(function(s){var on=s===t.status;
      return '<button data-set="'+s+'" aria-pressed="'+on+'" title="'+HELP[s]+'" style="'+
        (on?'background:'+SC[s]+';border-color:'+SC[s]:'')+'">'+s+'</button>';}).join('')+'</div>'+
    '<p class="mutedline" style="margin-top:8px">'+HELP[t.status]+'</p></div>'+
    '<div class="mfoot"><button class="btn" id="medit">Edit details</button>'+
    '<button class="btn danger" id="mdel">Delete task</button>'+
    '<span class="spacer"></span><button class="btn" id="mclose">Close</button></div>';
  var mask=wrapModal(h);
  el('mclose').onclick=shut;
  el('medit').onclick=function(){editCard(id);};
  el('mdel').onclick=function(){confirmDel(id,t.sub);};
  [].forEach.call(mask.querySelectorAll('[data-set]'),function(b){
    b.onclick=function(){var p={status:b.dataset.set};
      if(b.dataset.set==='Done'&&!t.actual)p.actual=TODAY;
      setTask(id,p);shut();toast(t.id+' → '+b.dataset.set);};});
}

function editCard(id){
  var t=byId(id);if(!t)return;
  var h='<div class="mhd"><div class="mid">'+t.id+'</div><h2>Edit task</h2></div><div class="mbd">'+
    fld('Task name','<input type="text" id="e_sub" value="'+esc(t.sub)+'">')+
    fld('What it involves','<textarea id="e_desc" rows="2">'+esc(t.desc)+'</textarea>')+
    fld('Finished when','<textarea id="e_dod" rows="2">'+esc(t.dod)+'</textarea>')+
    '<div class="row2">'+
      fld('Owner','<select id="e_owner">'+opts(D.owners,t.owner)+'</select>')+
      fld('Priority','<select id="e_pri">'+opts(['Critical','High','Medium','Low'],t.priority)+'</select>')+'</div>'+
    '<div class="row2">'+
      fld('Workstream','<select id="e_ws">'+opts(D.workstreams.map(function(w){return{v:w.id,l:w.name};}),t.ws)+'</select>')+
      fld('Phase','<select id="e_phase">'+opts(D.phases.map(function(p){return{v:p,l:p.replace(/^P\d\s/,'')};}),t.phase)+'</select>')+'</div>'+
    '<div class="row2">'+
      fld('Start date','<input type="date" id="e_start" value="'+esc(t.start)+'">')+
      fld('Deadline','<input type="date" id="e_due" value="'+esc(t.due)+'">')+'</div>'+
    '<div class="row2">'+
      fld('New deadline (if it moved)','<input type="date" id="e_rev" value="'+esc(t.revised||'')+'">')+
      fld('Status','<select id="e_status">'+opts(STATUSES,t.status)+'</select>')+'</div>'+
    fld('How it runs','<select id="e_mode">'+opts(MODEOPTS,t.mode)+'</select>')+
    fld('Notes','<textarea id="e_notes" rows="2">'+esc(t.notes)+'</textarea>')+
    '</div><div class="mfoot"><button class="btn on" id="esave">Save changes</button>'+
    '<button class="btn" id="ecancel">Cancel</button>'+
    '<span class="spacer"></span><button class="btn danger" id="edel">Delete task</button></div>';
  wrapModal(h);
  el('ecancel').onclick=function(){openCard(id);};
  el('edel').onclick=function(){confirmDel(id,t.sub);};
  el('esave').onclick=function(){
    var sub=el('e_sub').value.trim();
    if(!sub){toast('Give the task a name first.');return;}
    var st=el('e_start').value||t.start, du=el('e_due').value||t.due;
    if(du<st){toast('The deadline cannot be before the start date.');return;}
    setTask(id,{sub:sub,desc:el('e_desc').value,dod:el('e_dod').value,owner:el('e_owner').value,
      priority:el('e_pri').value,ws:el('e_ws').value,phase:el('e_phase').value,start:st,due:du,
      revised:el('e_rev').value,status:el('e_status').value,mode:el('e_mode').value,notes:el('e_notes').value});
    shut();toast('Saved');
  };
}

function confirmDel(id,name){
  wrapModal('<div class="mhd"><h2>Delete this task?</h2></div><div class="mbd">'+
    '<p>'+esc(name)+'</p><p class="mutedline" style="margin-top:10px">It disappears from the dashboard, timeline, board '+
    'and work breakdown. Nothing is lost for good — removed tasks sit at the bottom of the Dashboard and can be put back.</p>'+
    '</div><div class="mfoot"><button class="btn danger on" id="cyes">Yes, delete it</button>'+
    '<button class="btn" id="cno">Keep it</button></div>');
  el('cno').onclick=function(){openCard(id);};
  el('cyes').onclick=function(){deleteTask(id);shut();};
}

function openNew(wsPre,phasePre){
  var h='<div class="mhd"><h2>Add a task</h2></div><div class="mbd">'+
    fld('Task name','<input type="text" id="n_sub" placeholder="e.g. Book photographer for event day">')+
    fld('What it involves','<textarea id="n_desc" rows="2" placeholder="Optional"></textarea>')+
    '<div class="row2">'+
      fld('Owner','<select id="n_owner">'+opts(D.owners,'Wayne')+'</select>')+
      fld('Priority','<select id="n_pri">'+opts(['Critical','High','Medium','Low'],'Medium')+'</select>')+'</div>'+
    '<div class="row2">'+
      fld('Workstream','<select id="n_ws">'+opts(D.workstreams.map(function(w){return{v:w.id,l:w.name};}),wsPre||'WS01')+'</select>')+
      fld('Phase','<select id="n_phase">'+opts(D.phases.map(function(p){return{v:p,l:p.replace(/^P\d\s/,'')};}),phasePre||D.phases[0])+'</select>')+'</div>'+
    '<div class="row2">'+
      fld('Start date','<input type="date" id="n_start" value="'+TODAY+'">')+
      fld('Deadline','<input type="date" id="n_due" value="'+addDays(TODAY,7)+'">')+'</div>'+
    fld('How it runs','<select id="n_mode">'+opts(MODEOPTS,'')+'</select>')+
    fld('Notes','<textarea id="n_notes" rows="2" placeholder="Optional"></textarea>')+
    '</div><div class="mfoot"><button class="btn on" id="nsave">Add task</button>'+
    '<button class="btn" id="ncancel">Cancel</button></div>';
  wrapModal(h);
  el('ncancel').onclick=shut;
  el('nsave').onclick=function(){
    var sub=el('n_sub').value.trim();
    if(!sub){toast('Give the task a name first.');return;}
    var st=el('n_start').value||TODAY,du=el('n_due').value||addDays(TODAY,7);
    if(du<st){toast('The deadline cannot be before the start date.');return;}
    addTask({sub:sub,desc:el('n_desc').value,owner:el('n_owner').value,priority:el('n_pri').value,
      ws:el('n_ws').value,phase:el('n_phase').value,start:st,due:du,status:'Not Started',
      mode:el('n_mode').value,notes:el('n_notes').value});
    shut();
  };
}

/* ═══ WBS ═══ */
var WOPEN={},WF={owner:'',status:''};
function wbs(){
  var ALL=all();
  var A=ALL.filter(function(t){
    if(WF.owner&&t.owner!==WF.owner) return false;
    if(WF.status==='open'&&t.status==='Done') return false;
    if(WF.status&&WF.status!=='open'&&t.status!==WF.status) return false;
    return true;});
  var filtered=!!(WF.owner||WF.status);
  var phases=D.phases;
  var h='<div class="pagehd"><h1>Work Breakdown Structure</h1>'+
    '<p>The whole project broken down: project → phase → workstream → task. '+
    'Phase boxes carry the agreed phase window; workstream boxes carry the real span of their own tasks, '+
    'so a workstream appears under every phase it has work in. Click a workstream to open or close its '+
    'tasks, or a task to open and edit it.</p></div>'+
    '<div class="bar">'+
    '<select id="wowner"><option value="">Everyone</option>'+
      D.owners.filter(function(o){return ALL.some(function(t){return t.owner===o;});})
        .map(function(o){var c=ALL.filter(function(t){return t.owner===o;}).length;
          return '<option value="'+esc(o)+'"'+(o===WF.owner?' selected':'')+'>'+esc(o)+' ('+c+')</option>';}).join('')+
    '</select>'+
    '<select id="wstatus"><option value="">Any status</option>'+
      '<option value="open"'+(WF.status==='open'?' selected':'')+'>Not finished yet</option>'+
      STATUSES.map(function(x){return '<option value="'+esc(x)+'"'+(x===WF.status?' selected':'')+'>'+esc(x)+'</option>';}).join('')+
    '</select>'+
    (filtered?'<button class="btn" id="wclear">Clear filter</button>':'')+
    '<button class="btn" id="wall">Open everything</button>'+
    '<button class="btn" id="wnone">Close everything</button>'+
    '<button class="btn on" id="wadd">+ Add task</button>'+
    '<span class="spacer"></span><span class="mutedline">'+
      (filtered?'<b>'+A.length+'</b> of '+ALL.length+' tasks shown'+
        (WF.owner?' \u00b7 '+esc(WF.owner):''):ALL.length+' tasks')+'</span></div>'+
    '<div class="wbskey"><div class="keyrow"><b>Box colour = workstream</b>'+
      D.workstreams.map(function(w){return '<span><i class="sw" style="background:'+w.color+'"></i>'+esc(w.name)+'</span>';}).join('')+
    '</div><div class="keyrow"><b>Dot = task status</b>'+
      STATUSES.map(function(x){return '<span><i class="sw" style="background:'+SC[x]+';border-radius:50%"></i>'+x+'</span>';}).join('')+
    '</div></div>';

  h+='<div class="wbswrap"><div class="wbsroot">'+
     '<div class="nodebox rootbox"><span class="no">1</span><span class="lb">FEIC 2026 — Financial Empowerment Innovation Challenge</span></div>'+
     '<div class="rootstub"></div><div class="branches">';
  var shown=0;
  phases.forEach(function(ph,pi){
    var pn='1.'+(pi+1);
    var allpts=ALL.filter(function(t){return t.phase===ph;});
    var pts=A.filter(function(t){return t.phase===ph;});
    if(filtered&&!pts.length) return;
    if(!allpts.length) return;
    shown++;
    var wsIds=[];allpts.forEach(function(t){if(wsIds.indexOf(t.ws)<0)wsIds.push(t.ws);});
    var band=(D.phaseBands||[])[pi]||null;
    var p0=band?band[1]:pts.map(function(t){return t.start;}).sort()[0];
    var p1=band?band[2]:(function(){var a=pts.map(endOf).sort();return a[a.length-1];})();
    var pdn=pts.filter(function(t){return t.status==='Done';}).length;
    h+='<div class="branch"><div class="nodebox"'+(band?' style="background:'+band[3]+';color:#fff;border-color:rgba(0,0,0,.3)"':'')+
       '><span class="no">'+pn+'</span><span class="lb">'+
       esc(ph.replace(/^Phase\s\d\s·\s/,'').replace(/^P\d\s/,''))+
       ' &nbsp;<span style="opacity:.85">('+pdn+'/'+pts.length+')</span></span>'+
       '<span class="mt" style="color:rgba(255,255,255,.9)">'+fmt(p0)+' → '+fmt(p1)+'</span></div><div class="kids">';
    wsIds.forEach(function(wid,wi){
      var w=WS[wid],wn=pn+'.'+(wi+1);
      var allwts=allpts.filter(function(t){return t.ws===wid;});
      var wts=pts.filter(function(t){return t.ws===wid;});
      if(!wts.length) return;
      var key=ph+'|'+wid, open=filtered||!!WOPEN[key];
      var dn=wts.filter(function(t){return t.status==='Done';}).length;
      var ws0=wts.map(function(t){return t.start;}).sort()[0];
      var ws1=wts.map(endOf).sort();ws1=ws1[ws1.length-1];
      h+='<div class="node"><div class="nodebox wsbox click" data-w="'+esc(key)+'" style="background:'+w.color+'">'+
         '<span class="no">'+wn+'  '+(open?'▾':'▸')+'</span><span class="lb">'+esc(w.name)+
         ' &nbsp;<span style="opacity:.8">('+dn+'/'+wts.length+')</span></span>'+
         '<span class="mt" style="color:rgba(255,255,255,.85)">'+fmt(ws0)+' → '+fmt(ws1)+'</span></div>';
      if(open){
        h+='<div class="kids">';
        wts.forEach(function(t){
          var ti=allwts.indexOf(t);
          var due=endOf(t), late=isOverdue(t);
          var dtxt = late ? '<span class="late">'+fmt(due)+' \u2014 overdue</span>'
                   : (t.status==='Done' ? '<b>done</b>'+(t.actual?' '+fmt(t.actual):'')
                   : '<b>'+fmt(due)+'</b>');
          if(t.revised && t.revised!==t.due && !late && t.status!=='Done')
            dtxt += ' <span class="moved">(moved from '+fmt(t.due)+')</span>';
          h+='<div class="node"><div class="nodebox taskbox click" data-t="'+t.id+'" title="Click to open, edit or delete"><span class="no">'+wn+'.'+(ti+1)+
             '  <span style="font-weight:500;opacity:.65">'+t.id+'</span></span>'+
             '<span class="lb"><i class="dot" style="background:'+SC[t.status]+'"></i>'+esc(t.sub)+'</span>'+
             '<span class="mt">'+esc(t.owner)+' &nbsp;\u00b7&nbsp; '+fmt(t.start)+' \u2192 '+dtxt+
             (t.mode?' &nbsp;\u00b7&nbsp; <span style="color:'+MODEC(t.mode)+';font-weight:700">'+t.mode+'</span>':'')+'</span>'+
             '</div></div>';
        });
        h+='</div>';
      }
      h+='</div>';
    });
    h+='</div></div>';
  });
  h+='</div></div></div>';
  if(filtered&&!shown)
    h=h.split('<div class="wbswrap">')[0]+
      '<div class="card"><div class="empty">Nothing matches this filter.</div></div>';
  el('v-wbs').innerHTML=h;
  [].forEach.call(el('v-wbs').querySelectorAll('[data-w]'),function(n){
    n.onclick=function(){WOPEN[n.dataset.w]=!WOPEN[n.dataset.w];wbs();};});
  [].forEach.call(el('v-wbs').querySelectorAll('[data-t]'),function(n){
    n.onclick=function(){openCard(n.dataset.t);};});
  el('wadd').onclick=function(){openNew(null,null);};
  el('wowner').onchange=function(){WF.owner=this.value;wbs();};
  el('wstatus').onchange=function(){WF.status=this.value;wbs();};
  if(el('wclear')) el('wclear').onclick=function(){WF={owner:'',status:''};wbs();};
  el('wall').onclick=function(){D.phases.forEach(function(ph){D.workstreams.forEach(function(w){
    if(all().some(function(t){return t.phase===ph&&t.ws===w.id;}))WOPEN[ph+'|'+w.id]=true;});});wbs();};
  el('wnone').onclick=function(){WOPEN={};wbs();};
}

function render(){ if(CUR==='dash')dash(); else if(CUR==='time')time(); else if(CUR==='board')board(); else wbs(); }
el('themebtn').onclick=function(){var r=document.documentElement,c=r.getAttribute('data-theme');
  var dk=c?c==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  r.setAttribute('data-theme',dk?'light':'dark');};
(function(){var n=el('syncstate');
  if(n&&!remoteOn) n.title='Changes are saved in this browser only \u2014 teammates will not see them. '+
    'Set SYNC_URL near the top of this file, or use the claude.ai link, for shared updates.';})();
tabs();render();
})();
</script>
</body>
